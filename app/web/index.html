<!--
  The scanner page that staff open on their phones: the PIN screen, the Scan tab with the camera that reads
  ticket QR codes, the Search tab for finding an attendee by name, and the result card with Reprint and
  Try again. Served by the web Lambda; its script calls the API on the same origin.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Check-in</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <section id="pin-screen" class="screen" hidden>
      <h1>Check-in</h1>
      <p id="pin-message" class="warning" hidden></p>
      <label for="pin">Staff PIN</label>
      <input id="pin" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
      <button id="start" type="button" class="primary">Start</button>
    </section>

    <section id="app" class="screen" hidden>
      <nav class="top-bar">
        <div class="tabs">
          <button id="tab-scan" type="button" class="tab active">Scan</button>
          <button id="tab-search" type="button" class="tab">Search</button>
        </div>
        <button id="change-pin" type="button" class="link">Change PIN</button>
      </nav>

      <div id="card" class="card" hidden>
        <p id="card-name" class="card-name" hidden></p>
        <p id="card-message" class="card-message"></p>
        <button id="card-action" type="button" class="primary" hidden></button>
      </div>

      <section id="scan-view">
        <div id="reader" class="reader"></div>
        <p id="camera-message" class="warning" hidden></p>
      </section>

      <section id="search-view" hidden>
        <label for="search">Name or order code</label>
        <input id="search" type="search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
        <p id="search-message" class="note" hidden></p>
        <ul id="results" class="results"></ul>
        <p id="search-more" class="note" hidden>More than 50 matches — type more letters</p>
      </section>
    </section>
  </main>
  <script src="/vendor/html5-qrcode.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
